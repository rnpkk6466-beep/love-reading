<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ระบบรักการอ่าน</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
/* ===== Design tokens (ค่าสีถูกทับด้วย Settings ตอนเปิดเว็บ) ===== */
:root{
  --primary:#2563EB; --secondary:#FACC15; --success:#22C55E; --bg:#F8FAFC;
  --primary-dark:color-mix(in srgb,var(--primary) 78%,#000);
  --primary-soft:color-mix(in srgb,var(--primary) 11%,#fff);
  --ink:#1e293b; --muted:#64748b; --line:#e2e8f0; --radius:20px;
  --bs-primary:var(--primary); --bs-body-font-family:'Prompt','Noto Sans Thai',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{font-family:var(--bs-body-font-family);background:var(--bg);color:var(--ink);font-size:1rem;line-height:1.55;-webkit-tap-highlight-color:transparent;
  padding-bottom:env(safe-area-inset-bottom)}
img{max-width:100%}
a{color:var(--primary)}
.btn{min-height:44px;border-radius:14px;font-weight:600}
.btn-primary{--bs-btn-bg:var(--primary);--bs-btn-border-color:var(--primary);--bs-btn-hover-bg:var(--primary-dark);--bs-btn-hover-border-color:var(--primary-dark);--bs-btn-active-bg:var(--primary-dark);--bs-btn-active-border-color:var(--primary-dark);--bs-btn-disabled-bg:var(--primary);--bs-btn-disabled-border-color:var(--primary)}
.btn-outline-primary{--bs-btn-color:var(--primary);--bs-btn-border-color:var(--primary);--bs-btn-hover-bg:var(--primary);--bs-btn-hover-border-color:var(--primary);--bs-btn-active-bg:var(--primary);--bs-btn-active-border-color:var(--primary)}
.btn-kid{font-size:1.25rem;padding:.85rem 1.6rem;min-height:56px;border-radius:18px;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.btn-kid:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn-sun{background:var(--secondary);border-color:var(--secondary);color:#422006}
.btn-sun:hover{background:color-mix(in srgb,var(--secondary) 85%,#000);color:#422006}
.btn-go{background:var(--success);border-color:var(--success);color:#fff}
.btn-go:hover{background:color-mix(in srgb,var(--success) 85%,#000);color:#fff}
.form-control,.form-select{min-height:46px;border-radius:12px}
.form-control:focus,.form-select:focus{border-color:var(--primary);box-shadow:0 0 0 .25rem color-mix(in srgb,var(--primary) 25%,transparent)}
:focus-visible{outline:3px solid color-mix(in srgb,var(--primary) 55%,#fff);outline-offset:2px}
.emoji{display:inline-block;line-height:1}
.loader{position:fixed;inset:0;z-index:2000;background:rgba(255,255,255,.72);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.loader-box{background:#fff;border-radius:var(--radius);padding:1.4rem 2rem;text-align:center;box-shadow:0 10px 40px rgba(15,23,42,.18);font-weight:600}
.loader-book{font-size:2.6rem;animation:flip 1s ease-in-out infinite}
@keyframes flip{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg) translateY(-4px)}}

/* ===== Login ===== */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:1rem;background:
  radial-gradient(circle at 12% 18%,color-mix(in srgb,var(--secondary) 45%,transparent) 0 90px,transparent 91px),
  radial-gradient(circle at 92% 80%,color-mix(in srgb,var(--success) 35%,transparent) 0 120px,transparent 121px),
  linear-gradient(180deg,color-mix(in srgb,var(--primary) 18%,#fff),var(--bg))}
.login-pair{width:100%;max-width:980px;display:grid;grid-template-columns:1fr;border-radius:28px;overflow:hidden;box-shadow:0 18px 50px rgba(30,64,175,.2)}
.login-card{background:#fff;padding:1.6rem 1.4rem;order:1}
.guide-card{order:2;padding:1.6rem 1.4rem;color:#fff;background:linear-gradient(160deg,var(--primary),color-mix(in srgb,var(--primary) 55%,#7c3aed))}
.guide-card h2{font-size:1.4rem;font-weight:700;margin:0 0 1rem}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:.7rem}
.steps li{display:flex;gap:.8rem;align-items:center;background:rgba(255,255,255,.14);border-radius:18px;padding:.6rem .8rem;font-size:1.02rem;font-weight:500}
.steps .ic{flex:none;width:48px;height:48px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:1.6rem}
.guide-tip{margin-top:1rem;background:var(--secondary);color:#422006;border-radius:18px;padding:.7rem .9rem;font-weight:600}
.login-hero{text-align:center}
.login-hero .logo{height:76px;max-width:100%;object-fit:contain}
.login-hero .mascot{font-size:4rem;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.role-switch{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;background:var(--primary-soft);padding:.35rem;border-radius:16px}
.role-switch button{border:0;background:transparent;border-radius:12px;min-height:46px;font-weight:600;color:var(--muted)}
.role-switch button.on{background:#fff;color:var(--primary);box-shadow:0 2px 8px rgba(0,0,0,.08)}

/* ===== Student shell ===== */
.s-head{position:sticky;top:0;z-index:100;background:var(--primary);color:#fff;padding:.6rem 0;padding-top:calc(.6rem + env(safe-area-inset-top))}
.s-head .inner{max-width:1200px;margin:0 auto;padding:0 1rem;display:flex;align-items:center;gap:.75rem}
.s-head .brand{display:flex;align-items:center;gap:.5rem;font-weight:700;font-size:1.1rem;margin-right:auto;min-width:0}
.s-head .brand span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-head .brand img{height:34px}
.s-head .me{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:999px;padding:.3rem .85rem;min-height:44px;max-width:46vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-links{display:none;gap:.25rem}
.s-links a{color:#fff;text-decoration:none;padding:.5rem 1rem;border-radius:12px;font-weight:600}
.s-links a.on,.s-links a:hover{background:rgba(255,255,255,.22)}
.icon-btn{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:12px;width:44px;height:44px}
.wrap{max-width:1200px;margin:0 auto;padding:1rem}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:100;display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.bottom-nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:62px;color:var(--muted);text-decoration:none;font-size:.82rem;font-weight:600}
.bottom-nav a i{font-size:1.45rem;line-height:1}
.bottom-nav a.on{color:var(--primary);background:var(--primary-soft)}
body.is-student{padding-bottom:calc(72px + env(safe-area-inset-bottom))}

/* ===== Cards ===== */
.panel{background:#fff;border-radius:var(--radius);padding:1.1rem;box-shadow:0 2px 14px rgba(15,23,42,.06)}
.hello{background:linear-gradient(135deg,var(--primary),color-mix(in srgb,var(--primary) 60%,#7c3aed));color:#fff;border-radius:var(--radius);padding:1.1rem 1.2rem;display:flex;gap:1rem;align-items:center}
.hello .big{font-size:2.8rem}
.hello h1{font-size:1.25rem;margin:0;font-weight:700}
.lvbar{height:10px;border-radius:99px;background:rgba(255,255,255,.3);overflow:hidden;margin-top:.4rem}
.lvbar>i{display:block;height:100%;background:var(--secondary);border-radius:99px}
.stat-card{border-radius:var(--radius);padding:.9rem 1rem;height:100%;color:#fff;position:relative;overflow:hidden}
.stat-card .stat-icon{font-size:1.9rem;line-height:1}
.stat-card .stat-label{font-size:.9rem;opacity:.92;font-weight:500}
.stat-card .stat-val{font-size:1.7rem;font-weight:700;line-height:1.2}
.stat-card .stat-val small{font-size:.85rem;font-weight:500}
.c-star{background:#f59e0b}.c-read{background:var(--primary)}.c-book{background:#10b981}.c-medal{background:#8b5cf6}.c-pink{background:#ec4899}
.goal-bar{height:26px;border-radius:99px;background:#e0f2fe;overflow:hidden}
.goal-bar>i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--success),var(--success) 12px,color-mix(in srgb,var(--success) 80%,#fff) 12px,color-mix(in srgb,var(--success) 80%,#fff) 24px);border-radius:99px;transition:width .6s}
.resume{background:#fff7ed;border:2px dashed #fb923c;border-radius:var(--radius);padding:.9rem 1rem;display:flex;gap:.8rem;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:.5rem;overflow-x:auto;padding-bottom:.25rem;scrollbar-width:none}
.chip{border:2px solid var(--line);background:#fff;border-radius:99px;padding:.35rem 1rem;min-height:44px;white-space:nowrap;font-weight:600;color:var(--muted)}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.lesson-card{background:#fff;border-radius:var(--radius);overflow:hidden;box-shadow:0 2px 14px rgba(15,23,42,.07);height:100%;display:flex;flex-direction:column;border:2px solid transparent}
.lesson-card .pic{aspect-ratio:16/10;display:grid;place-items:center;background:var(--primary-soft);overflow:hidden}
.lesson-card .pic img{width:100%;height:100%;object-fit:cover}
.lesson-card .pic .emoji{font-size:4.2rem}
.lesson-card .body{padding:.9rem 1rem 1rem;display:flex;flex-direction:column;gap:.35rem;flex:1}
.lesson-card h3{font-size:1.15rem;font-weight:700;margin:0}
.lesson-card p{margin:0;color:var(--muted);font-size:.92rem}
.tag{display:inline-block;background:var(--primary-soft);color:var(--primary-dark);border-radius:99px;padding:.1rem .65rem;font-size:.78rem;font-weight:600}
.tag.y{background:#fef9c3;color:#854d0e}
.hist-item{display:flex;gap:.8rem;align-items:center;background:#fff;border-radius:16px;padding:.7rem .9rem;box-shadow:0 1px 8px rgba(15,23,42,.05)}
.hist-item .pic{width:52px;height:52px;border-radius:14px;background:var(--primary-soft);display:grid;place-items:center;flex:none;overflow:hidden}
.hist-item .pic .emoji{font-size:1.9rem}.hist-item .pic img{width:100%;height:100%;object-fit:cover}
.score-pill{margin-left:auto;background:#fef3c7;color:#92400e;border-radius:99px;padding:.2rem .8rem;font-weight:700;white-space:nowrap}
.badge-card{background:#fff;border-radius:var(--radius);padding:1rem;text-align:center;height:100%;box-shadow:0 2px 12px rgba(15,23,42,.06)}
.badge-card .ic{font-size:3rem}
.badge-card.locked{opacity:.78}.badge-card.locked .ic{filter:grayscale(1)}
.empty{text-align:center;padding:2.2rem 1rem;color:var(--muted)}.empty .emoji{font-size:3.4rem}.empty h4{color:var(--ink);font-size:1.15rem;margin-top:.6rem}

/* ===== Reading ===== */
.read-top{position:sticky;top:calc(58px + env(safe-area-inset-top));z-index:50}
.timer-box{background:#fff;border:3px solid var(--primary);border-radius:var(--radius);padding:.8rem 1rem;text-align:center;box-shadow:0 8px 24px rgba(37,99,235,.15)}
.timer{font-size:clamp(2.6rem,13vw,4.6rem);font-weight:700;font-variant-numeric:tabular-nums;color:var(--primary);line-height:1.1;letter-spacing:.02em}
.pulse{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--success);margin-right:.4rem;animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.6)}100%{box-shadow:0 0 0 12px rgba(34,197,94,0)}}
.content-frame{width:100%;height:62vh;min-height:320px;border:0;border-radius:var(--radius);background:#fff;box-shadow:0 2px 14px rgba(15,23,42,.08)}
.story{white-space:pre-wrap;overflow-wrap:anywhere;line-height:2;font-weight:500;font-size:1.35rem}
.ready-card{max-width:560px;margin:0 auto;text-align:center}
.ready-card .pic{font-size:6rem}.ready-card img.cover{max-height:240px;border-radius:var(--radius)}
.pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.swal2-popup{font-family:var(--bs-body-font-family);border-radius:24px}

/* ===== Teacher shell ===== */
.t-top{position:sticky;top:0;z-index:100;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:.6rem;padding:.5rem 1rem;padding-top:calc(.5rem + env(safe-area-inset-top))}
.t-top .ttl{font-weight:700;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-menu a{display:flex;align-items:center;gap:.7rem;padding:.7rem .9rem;border-radius:14px;color:var(--ink);text-decoration:none;font-weight:500;min-height:46px}
.t-menu a i{font-size:1.2rem;width:1.4rem;text-align:center}
.t-menu a:hover{background:var(--primary-soft)}
.t-menu a.on{background:var(--primary);color:#fff}
.t-side{display:none}
.t-brand{display:flex;align-items:center;gap:.6rem;font-weight:700;padding:.4rem .5rem 1rem;font-size:1.1rem}.t-brand img{height:36px}
.t-main{padding:1rem;max-width:1400px}
.page-head{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-bottom:1rem}.page-head h1{font-size:1.4rem;font-weight:700;margin:0 auto 0 0}
.fbar{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem;background:#fff;border-radius:var(--radius);padding:.9rem;margin-bottom:1rem;box-shadow:0 2px 12px rgba(15,23,42,.05)}
.fbar label{font-size:.8rem;color:var(--muted);font-weight:600}
.fbar .full{grid-column:1/-1}
.tbl-wrap{overflow-x:auto;background:#fff;border-radius:var(--radius);box-shadow:0 2px 12px rgba(15,23,42,.05)}
.tbl-wrap table{margin:0;min-width:100%}
.tbl-wrap th{background:var(--primary-soft);font-weight:600;white-space:nowrap}
.tbl-wrap td{vertical-align:middle}
.tr-click{cursor:pointer}
.rank-row{display:flex;gap:.8rem;align-items:center;padding:.7rem .4rem;border-bottom:1px solid var(--line)}.rank-row:last-child{border:0}
.rank-no{width:2.4rem;text-align:center;font-size:1.5rem;font-weight:700}
.mini-bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;min-width:60px}.mini-bar>i{display:block;height:100%;background:var(--primary)}
.chart-box{position:relative;height:260px}

/* ===== Breakpoints (Mobile First) ===== */
@media (min-width:576px){.fbar{grid-template-columns:repeat(3,1fr)}.login-card,.guide-card{padding:2rem}}
@media (min-width:768px){
  .s-links{display:flex}.bottom-nav{display:none}body.is-student{padding-bottom:0}
  .fbar{grid-template-columns:repeat(4,1fr)}.wrap{padding:1.4rem}.t-main{padding:1.4rem}
  .login-pair{grid-template-columns:1fr 1fr}.guide-card{order:1}.login-card{order:2;display:flex;flex-direction:column;justify-content:center}
}
@media (min-width:992px){
  .t-side{display:block;position:fixed;inset:0 auto 0 0;width:256px;background:#fff;border-right:1px solid var(--line);padding:1rem .8rem;overflow-y:auto}
  .t-top .menu-btn{display:none}.t-shell{margin-left:256px}
  .fbar{grid-template-columns:repeat(6,1fr)}.fbar .full{grid-column:auto}
}
@media (min-width:1440px){.wrap{max-width:1360px}}
@media (min-width:1920px){html{font-size:18px}.wrap{max-width:1600px}}
@media (max-width:359px){html{font-size:15px}.hello .big{font-size:2.2rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
  <div id="app"></div>

  <!-- Loading overlay -->
  <div id="loader" class="loader d-none" role="status" aria-live="polite">
    <div class="loader-box"><div class="loader-book">📖</div><div id="loaderText">กำลังโหลดข้อมูล...</div></div>
  </div>

  <!-- Modal กลาง ใช้ซ้ำทุกหน้า -->
  <div class="modal fade" id="mainModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-lg">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title" id="mTitle"></h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="ปิด"></button></div>
        <div class="modal-body" id="mBody"></div>
        <div class="modal-footer" id="mFoot"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script>
/* ===== ตั้งค่า: วาง URL ของ Apps Script Web App (ลงท้ายด้วย /exec) ===== */
const API_URL = 'https://script.google.com/macros/s/AKfycbwTAL4Y2abMtk-vYzjxNg-WbcAEYi8KjmMbQQkjCxtN5C75TUHmD7j_Av1LyJ3PFzet/exec';
(function () {
'use strict';
/* ============ Helpers ============ */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const S = { fs: 1.35, token: null, user: null, set: { systemName: 'ระบบรักการอ่าน', schoolName: '', logoUrl: '' }, opts: null, rows: {}, timers: [], chart: null, mem: {}, lastErr: null, loginRole: 'STUDENT' };
const store = {
  get(k) { try { return sessionStorage.getItem(k); } catch (e) { return S.mem[k] || null; } },
  set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) { S.mem[k] = v; } },
  del(k) { try { sessionStorage.removeItem(k); } catch (e) { delete S.mem[k]; } }
};
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const isUrl = s => /^https?:\/\//i.test(s || '');
const fmtN = n => Number(n || 0).toLocaleString('th-TH');
const fmtDate = s => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? `${m[3]}/${m[2]}/${+m[1] + 543}` : (s || ''); };
const clock = sec => [Math.floor(sec / 3600), Math.floor(sec % 3600 / 60), sec % 60].map(n => String(n).padStart(2, '0')).join(':');
const media = (img, cls) => isUrl(img)
  ? `<img class="${cls || ''}" src="${esc(img)}" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('📚'))">`
  : `<span class="emoji ${cls || ''}">${esc(img || '📚')}</span>`;
const logoHtml = () => isUrl(S.set.logoUrl) ? `<img src="${esc(S.set.logoUrl)}" alt="">` : '<span class="emoji">📚</span>';
const empty = (icon, title, sub) => `<div class="empty"><div class="emoji">${icon}</div><h4>${title}</h4><div>${sub || ''}</div></div>`;
const view = () => $('#view');
const clearTimers = () => { S.timers.forEach(t => { clearInterval(t); clearTimeout(t); }); S.timers = []; if (S.chart) { S.chart.destroy(); S.chart = null; } };
const formObj = sel => { const o = {}; $$('[name]', $(sel)).forEach(el => { o[el.name] = el.type === 'checkbox' ? el.checked : el.value; }); return o; };

/* ============ Loading + API ============ */
let loads = 0;
function loading(on, text) {
  loads = Math.max(0, loads + (on ? 1 : -1));
  if (text) $('#loaderText').textContent = text;
  $('#loader').classList.toggle('d-none', loads === 0);
}
function handleErr(res, title) {
  S.lastErr = res;
  if (res.code === 'SESSION_EXPIRED') {
    S.token = null; S.user = null; store.del('lr_token');
    Swal.fire({ icon: 'info', title: '⏰ หมดเวลาการใช้งาน', text: 'กรุณาเข้าสู่ระบบอีกครั้ง', confirmButtonText: 'ตกลง' }).then(() => { location.hash = '#/login'; route(); });
    return;
  }
  Swal.fire({ icon: 'error', title: '❌ ' + (title || 'เกิดข้อผิดพลาด'), text: res.message || 'กรุณาลองใหม่อีกครั้ง', confirmButtonText: 'ตกลง' });
}
/** เรียก Backend ผ่าน api(token, action, payload) คืนค่า data หรือ null เมื่อผิดพลาด (แสดง SweetAlert2 ให้แล้ว) */
function call(action, payload, o) {
  o = o || {};
  return new Promise(resolve => {
    const show = o.text !== false && !o.silent;
    if (show) loading(true, o.text || 'กำลังโหลดข้อมูล...');
    const fail = () => {
      if (show) loading(false);
      S.lastErr = { code: 'NETWORK', message: 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้' };
      if (!o.silent) handleErr({ message: 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่' }, 'เครือข่ายขัดข้อง');
      resolve(null);
    };
    if (!API_URL || API_URL.indexOf('PASTE_') === 0) { S.lastErr = { message: 'ยังไม่ได้ตั้งค่า API_URL ในไฟล์ index.html' }; if (show) loading(false); return resolve(null); }
    // ส่ง body เป็นข้อความล้วน (ไม่ตั้ง Content-Type) เพื่อเป็น "simple request" ไม่ต้อง preflight CORS
    fetch(API_URL, { method: 'POST', redirect: 'follow', body: JSON.stringify({ token: S.token, action: action, payload: payload || {} }) })
      .then(r => r.json())
      .then(res => {
        if (show) loading(false);
        if (res && res.success) { S.lastErr = null; return resolve(res.data === null ? {} : res.data); }
        S.lastErr = res || {};
        if (!o.silent) handleErr(res || {}, o.errTitle); else if (res && res.code === 'SESSION_EXPIRED') handleErr(res);
        resolve(null);
      })
      .catch(fail);
  });
}

let R = null;
const embedUrl = u => {
  try {
    const x = new URL(u), h = x.hostname.replace(/^www\./, '');
    if (h === 'youtube.com' || h === 'm.youtube.com') { const v = x.searchParams.get('v'); if (v) return 'https://www.youtube.com/embed/' + v; }
    if (h === 'youtu.be') return 'https://www.youtube.com/embed/' + x.pathname.slice(1);
    if (h === 'drive.google.com') { const m = x.pathname.match(/\/file\/d\/([^/]+)/); if (m) return 'https://drive.google.com/file/d/' + m[1] + '/preview'; }
    if (h === 'docs.google.com') return u.replace(/\/(edit|view)(\?.*)?$/, '/preview');
  } catch (e) { }
  return u;
};

function setFs(d) { S.fs = Math.max(1, Math.min(2.6, S.fs + d)); const el = $('#story'); if (el) el.style.fontSize = S.fs + 'rem'; }

function enterReading(s) {
  R.sessionId = s.sessionId; R.startMs = s.startMs; R.off = s.serverNowMs - Date.now(); R.lesson = s.lesson || R.lesson;
  const el0 = (Date.now() + R.off - R.startMs) / 60000;
  R.rules.forEach(r => { if (el0 >= r.minMinutes) R.ann[r.ruleId] = 1; });       // ไม่เด้งซ้ำถ้ากลับมาอ่านต่อ

    ${l.contentUrl ? `<div class="text-center mt-2"><a class="btn btn-outline-primary" href="${esc(l.contentUrl)}" target="_blank" rel="noopener"><i class="bi bi-box-arrow-up-right"></i> เปิดลิงก์เพิ่มเติม</a></div>` : ''}`;
  tick(); S.timers.push(setInterval(tick, 1000));
  S.timers.push(setInterval(() => call('ping', {}, { silent: true }), 240000));   // ต่ออายุ Login ระหว่างอ่านนาน ๆ
}
function tick() {
  const el = $('#timer'); if (!el || !R) return;
  const sec = Math.max(0, Math.floor((Date.now() + R.off - R.startMs) / 1000)), min = Math.floor(sec / 60);
  el.textContent = clock(sec);
  R.rules.forEach(r => {
    if (R.ann[r.ruleId] || min < r.minMinutes) return;
    R.ann[r.ruleId] = 1;
    const top = R.rules.reduce((a, b) => b.score > a.score ? b : a);
    Swal.fire({ toast: true, position: 'top', icon: 'success', timer: 5000, showConfirmButton: false,
      title: r === top ? `🏆 ยอดเยี่ยม! ครบ ${r.minMinutes} นาทีแล้ว` : `🎉 ครบ ${r.minMinutes} นาทีแล้ว!`, text: `ได้รับ ${r.score} คะแนน` });
  });
}

function fbar(id, fields, o, extra) {
  const sel = (n, l, arr, ph) => `<div><label>${l}</label><select class="form-select" name="${n}"><option value="">${ph || 'ทั้งหมด'}</option>${arr.map(a => `<option value="${esc(a[0])}">${esc(a[1])}</option>`).join('')}</select></div>`;

    active: sel('active', 'สถานะ', [['1', 'ใช้งาน'], ['0', 'ปิดใช้งาน']]), period: sel('period', 'ช่วงเวลา', PERIODS, 'ทั้งหมด'),
    dateFrom: '<div><label>วันที่เริ่มต้น</label><input type="date" class="form-control" name="dateFrom"></div>', dateTo: '<div><label>วันที่สิ้นสุด</label><input type="date" class="form-control" name="dateTo"></div>'
  };

function bindF(id, fn, defaults) {

}

  bindF('fl', async f => {
    const l = await call('getReadingLogs', f); if (!l) return;
    $('#out').innerHTML = l.length ? tbl(['วันที่', 'เวลา', 'นักเรียน', 'บทเรียน', 'นาที', 'คะแนน', ''], l.map(x => `<tr><td>${fmtDate(x.date)}</td><td>${esc(x.startTime.slice(0, 5))}-${esc(x.endTime.slice(0, 5))}</td><td>${esc(x.studentName)}<div class="small text-muted">${esc(x.className)}/${esc(x.room)}</div></td>
      <td>${esc(x.lessonTitle)}</td><td>${x.minutes}</td><td><b>${x.score}</b></td><td><button class="btn btn-sm btn-outline-secondary" data-act="logEdit" data-id="${x.logId}" data-score="${x.score}" title="แก้ไขคะแนน"><i class="bi bi-pencil-square"></i></button></td></tr>`).join(''))
      : `<div class="panel">${empty('📖', 'ไม่พบประวัติการอ่าน', 'ลองเปลี่ยนตัวกรอง')}</div>`;
  });
}
async function editLogScore(id, cur) {
  const r = await Swal.fire({ title: 'แก้ไขคะแนน', html: `<input id="sc" class="swal2-input" type="number" min="0" step="1" value="${cur}" placeholder="คะแนนใหม่"><input id="rs" class="swal2-input" placeholder="เหตุผล (จำเป็น)">`,
    showCancelButton: true, confirmButtonText: 'บันทึก', cancelButtonText: 'ยกเลิก', focusConfirm: false, preConfirm: () => ({ score: $('#sc').value, reason: $('#rs').value }) });
  if (!r.isConfirmed) return;
  if (await call('adjustLogScore', { logId: id, score: r.value.score, reason: r.value.reason }, { text: 'กำลังบันทึก...' })) { toast('แก้ไขคะแนนแล้ว'); $('#fl').requestSubmit(); }
}
const reportTable = (rows, click) => rows.length ? tbl(['นักเรียน', 'ชั้น/ห้อง', 'เวลาอ่าน (นาที)', 'จำนวนเรื่อง', 'คะแนน'], rows.map(r => `<tr class="${click ? 'tr-click' : ''}" ${click ? `data-act="stuView" data-id="${r.studentId}"` : ''}><td><div class="fw-semibold">${esc(r.studentName)}</div><div class="small text-muted">${esc(r.studentCode)}</div></td>
  <td>${esc(r.className)} / ${esc(r.room)}</td><td>${fmtN(r.minutes)}</td><td>${fmtN(r.count)}</td><td><b>${fmtN(r.score)}</b></td></tr>`).join('')) : `<div class="panel">${empty('📊', 'ไม่พบข้อมูล', 'ลองเปลี่ยนตัวกรอง')}</div>`;
async function vTScores() {
  tShell('scores'); const o = await getOpts();
  view().innerHTML = pageHead('⭐ คะแนนนักเรียน') + fbar('fc', ['q', 'className', 'room', 'period'], o) + '<div id="out"></div>';
  bindF('fc', async f => { const r = await call('getReadingReport', f); if (r) $('#out').innerHTML = reportTable(r.rows.slice().sort((a, b) => b.score - a.score), true); });
}
async function vTRank() {
  tShell('rank'); const o = await getOpts();
  view().innerHTML = pageHead('🏆 อันดับนักอ่าน') + fbar('fr', ['period', 'className', 'room'], o) + '<div class="panel" id="out"></div>';
  bindF('fr', async f => { f.limit = 50; const r = await call('getTopReaders', f); if (r) $('#out').innerHTML = rankList(r); }, { period: 'month' });
}

/* ----- Reports ----- */
async function vTReports() {
  tShell('reports'); const o = await getOpts();
  view().innerHTML = pageHead('📑 รายงานการอ่าน') + fbar('fp', ['className', 'room', 'studentId', 'lessonId', 'dateFrom', 'dateTo'], o, '<button type="button" class="btn btn-success" data-act="csv"><i class="bi bi-filetype-csv"></i> CSV</button>') + '<div id="out"></div>';
  bindF('fp', async f => {
    const [r, c] = await Promise.all([call('getReadingReport', f), call('getClassSummary', f, { silent: true })]); if (!r) return;
    const t = r.total;
    $('#out').innerHTML = `<div class="row g-2 mb-3 text-center">${[['👧', 'นักเรียน', t.students], ['⏱️', 'เวลารวม (นาที)', t.minutes], ['📚', 'จำนวนเรื่อง', t.count], ['⭐', 'คะแนนรวม', t.score]].map(x => `<div class="col-6 col-md-3"><div class="panel py-2"><div>${x[0]} <b class="fs-4">${fmtN(x[2])}</b></div><div class="small text-muted">${x[1]}</div></div></div>`).join('')}</div>`
      + reportTable(r.rows, true)
      + (c && c.length ? `<h6 class="mt-4">สรุปตามห้องเรียน</h6>` + tbl(['ชั้น/ห้อง', 'นักเรียน', 'เวลารวม', 'เฉลี่ย/คน', 'จำนวนเรื่อง', 'คะแนน'], c.map(x => `<tr><td>${esc(x.className)} / ${esc(x.room)}</td><td>${x.students}</td><td>${fmtN(x.minutes)}</td><td>${fmtN(x.avgMinutes)}</td><td>${fmtN(x.count)}</td><td><b>${fmtN(x.score)}</b></td></tr>`).join('')) : '');
  });
}
async function exportCsv() {
  const d = await call('exportReportCsv', Object.fromEntries(new FormData($('#fp'))), { text: 'กำลังสร้างไฟล์...' }); if (!d) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\uFEFF' + d.csv], { type: 'text/csv;charset=utf-8;' })); a.download = d.filename;
  document.body.appendChild(a); a.click(); a.remove(); toast('ดาวน์โหลดไฟล์ CSV แล้ว');
}

/* ----- Score rules ----- */
const ruleRow = r => { r = r || { ruleId: '', minMinutes: '', maxMinutes: '', score: '', description: '', active: true };
  return `<tr data-rid="${esc(r.ruleId)}"><td><input class="form-control" style="min-width:80px" type="number" min="0" name="minMinutes" value="${esc(r.minMinutes)}"></td><td><input class="form-control" style="min-width:90px" type="number" min="0" name="maxMinutes" value="${esc(r.maxMinutes)}"></td>
  <td><input class="form-control" style="min-width:70px" type="number" min="0" name="score" value="${esc(r.score)}"></td><td><input class="form-control" style="min-width:160px" name="description" value="${esc(r.description)}"></td>
  <td class="text-center"><input class="form-check-input" type="checkbox" name="active" ${r.active ? 'checked' : ''}></td><td><button class="btn btn-sm btn-outline-danger" data-act="ruleDel" aria-label="ลบ"><i class="bi bi-trash"></i></button></td></tr>`; };
async function vTRules() {
  tShell('rules');
  const r = await call('getAllScoreRules'); if (!r) { view().innerHTML = retryBox(); return; }
  view().innerHTML = pageHead('🎚️ ตั้งค่าเกณฑ์คะแนน', '<button class="btn btn-outline-primary" data-act="ruleAdd"><i class="bi bi-plus-lg"></i> เพิ่มเกณฑ์</button><button class="btn btn-primary" data-act="ruleSave">💾 บันทึก</button>')
    + `<div class="alert alert-info">คะแนนคำนวณจาก "นาทีที่อ่านจริง" (ปัดลงเป็นนาทีเต็ม) ช่วงเวลาของเกณฑ์ที่เปิดใช้งานต้องไม่ซ้อนทับกัน มีผลทันทีกับการอ่านครั้งถัดไป</div>`
    + tbl(['นาทีต่ำสุด', 'นาทีสูงสุด', 'คะแนน', 'คำอธิบาย', 'ใช้งาน', ''], r.map(ruleRow).join(''), '').replace('<tbody>', '<tbody id="rb">');
}
async function saveRules() {
  const rules = $$('#rb tr').map((tr, i) => ({ ruleId: tr.dataset.rid, minMinutes: $('[name=minMinutes]', tr).value, maxMinutes: $('[name=maxMinutes]', tr).value, score: $('[name=score]', tr).value, description: $('[name=description]', tr).value, active: $('[name=active]', tr).checked, sortOrder: i + 1 }));
  if (await call('saveScoreRules', { rules }, { text: 'กำลังบันทึก...' })) { toast('บันทึกเกณฑ์คะแนนแล้ว'); vTRules(); }
}

/* ----- System settings (ADMIN) ----- */
async function vTSettings() {
  tShell('settings');
  if (S.user.role !== 'ADMIN') { view().innerHTML = `<div class="panel">${empty('🔒', 'เฉพาะผู้ดูแลระบบ', 'บัญชีนี้ไม่มีสิทธิ์แก้ไขการตั้งค่าระบบ')}</div>`; return; }
  const l = await call('getAllSettings'); if (!l) { view().innerHTML = retryBox(); return; }
  view().innerHTML = pageHead('⚙️ ตั้งค่าระบบ', '<button class="btn btn-primary" data-act="setSave">💾 บันทึก</button>') + `<form id="stf" class="panel"><div class="row g-3">${l.map(x => `<div class="col-md-6"><label class="form-label fw-semibold">${esc(x.key)}</label>
    <input class="form-control ${/_COLOR$/.test(x.key) ? 'form-control-color w-100' : ''}" ${/_COLOR$/.test(x.key) ? 'type="color"' : ''} data-key="${esc(x.key)}" value="${esc(x.value)}"><div class="form-text">${esc(x.description)}</div></div>`).join('')}</div></form>`;
}
async function saveSettings() {
  const items = $$('#stf [data-key]').map(e => ({ key: e.dataset.key, value: e.value }));
  if (await call('saveSettings', { items }, { text: 'กำลังบันทึก...' })) { toast('บันทึกการตั้งค่าแล้ว (ธีมใหม่จะเห็นหลังรีเฟรช)'); }
}

/* ============ Events (delegation) ============ */
const ACT = {
  role: el => { S.loginRole = el.dataset.role; renderLogin(); },
  eye: el => { const i = $('#lp'); i.type = i.type === 'password' ? 'text' : 'password'; },
  logout: (el, e) => { e.preventDefault(); doLogout(); },
  profile: showProfile, reload: () => route(),
  cat: el => { $$('.chip').forEach(c => c.classList.toggle('on', c === el)); $$('#lessonGrid > div').forEach(c => { c.style.display = !el.dataset.cat || c.dataset.cat === el.dataset.cat ? '' : 'none'; }); },
  fsUp: () => setFs(.15), fsDown: () => setFs(-.15),
  startRead: startRead, finishRead: finishRead, cancelRead: cancelRead,
  stuNew: () => openStudentForm({}), stuEdit: el => openStudentForm(S.rows.stu.find(s => s.studentId === el.dataset.id) || {}), stuSave: saveStudent,
  stuView: (el, e) => { e.preventDefault(); viewStudent(el.dataset.id); },
  stuTog: async el => { const on = el.checked, ok = await call('toggleStudent', { studentId: el.dataset.id, active: on }, { text: 'กำลังบันทึก...' }); if (!ok) el.checked = !on; else toast(on ? 'เปิดใช้งานนักเรียนแล้ว' : 'ปิดใช้งานนักเรียนแล้ว'); },
  lesNew: () => openLessonForm({}), lesEdit: el => openLessonForm(S.rows.les.find(l => l.lessonId === el.dataset.id) || {}), lesSave: saveLesson,
  lesTog: async el => { const on = el.checked, ok = await call('toggleLesson', { lessonId: el.dataset.id, active: on }, { text: 'กำลังบันทึก...' }); if (!ok) el.checked = !on; else toast(on ? 'เปิดบทเรียนแล้ว' : 'ปิดบทเรียนแล้ว'); },
  logEdit: el => editLogScore(el.dataset.id, el.dataset.score), csv: exportCsv,
  ruleAdd: () => $('#rb').insertAdjacentHTML('beforeend', ruleRow()), ruleDel: el => el.closest('tr').remove(), ruleSave: saveRules, setSave: saveSettings
};
/* ลิงก์ภายในแอป (#/...) เปลี่ยนหน้าด้วย JS ไม่ให้เบราว์เซอร์นำทางออกจาก iframe (กันหน้าขาว) */
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#/"]');
  if (!a) return;
  e.preventDefault();
  if (location.hash === a.getAttribute('href')) route(); else location.hash = a.getAttribute('href');
});
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el && ACT[el.dataset.act] && el.type !== 'checkbox') { ACT[el.dataset.act](el, e); } });
document.addEventListener('change', e => { const el = e.target; if (el.type === 'checkbox' && el.dataset.act && ACT[el.dataset.act]) ACT[el.dataset.act](el, e); });
document.addEventListener('submit', e => { if (e.target.id === 'lf') { e.preventDefault(); doLogin(e.target); } });

/* ============ Router (SPA, hash) ============ */
function route() {
  clearTimers();
  const parts = (location.hash || '').replace(/^#\/?/, '').split('/').filter(Boolean), first = parts[0] || '';
  if (!S.user) { if (first !== 'login') { location.hash = '#/login'; return; } return renderLogin(); }
  const teacher = S.user.role !== 'STUDENT', home = teacher ? '#/teacher' : '#/student';
  if (!first || first === 'login' || (teacher && first !== 'teacher') || (!teacher && first === 'teacher')) { if (location.hash !== home) { location.hash = home; return; } }
  window.scrollTo(0, 0);
  if (teacher) {
    const T = { '': vTDash, students: vTStudents, lessons: vTLessons, logs: vTLogs, scores: vTScores, ranking: vTRank, reports: vTReports, rules: vTRules, settings: vTSettings };
    return (T[parts[1] || ''] || vTDash)();
  }
  if (first === 'reading' && parts[1]) return vReading(decodeURIComponent(parts[1]));
  if (first === 'history') return vHistory();
  if (first === 'badges') return vBadges();
  return vStudentHome();
}
window.addEventListener('hashchange', route);

/* ============ Boot ============ */
(async function boot() {
  const st = await call('getPublicSettings', {}, { text: 'กำลังเริ่มระบบ...', silent: true });
  if (!st) {
    $('#app').innerHTML = `<div class="login-wrap"><div class="login-card text-center" style="max-width:440px;border-radius:28px">${empty('🛠️', 'ระบบยังไม่พร้อมใช้งาน', esc((S.lastErr && S.lastErr.message) || 'กรุณาติดต่อผู้ดูแลระบบ'))}<button class="btn btn-primary mt-3" data-act="reload">ลองใหม่</button></div></div>`;
    ACT.reload = () => location.reload(); return;
  }
  applySettings(st);
  const t = store.get('lr_token');
  if (t) { S.token = t; loading(true, 'กำลังกู้คืนการเข้าสู่ระบบ...'); const u = await call('getCurrentUser', {}, { silent: true, text: false }); loading(false); if (u) S.user = u; else { S.token = null; store.del('lr_token'); } }
  route();
})();
})();
</script>

</body>
